[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "activy-checker"
version = "0.1.0"
description = "Verify that your Garmin activities were correctly imported into Activy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michał Kaftański" }]
keywords = ["activy", "garmin", "fitness", "activities", "sync"]
dependencies = [
    "garminconnect>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/kaftee/activy-checker"
Issues = "https://github.com/kaftee/activy-checker/issues"

[project.scripts]
activy-checker = "activy_checker.cli:main"

[tool.setuptools]
packages = ["activy_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
