[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "activy-checker"
version = "0.2.6"
description = "Audit Activy's activity sync: detect missing activities and incorrect distances."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Kaftański" }]
keywords = ["activy", "garmin", "fitness", "activities", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/kaftee/activy-checker"
Documentation = "https://github.com/kaftee/activy-checker/blob/main/docs/usage.md"
Changelog = "https://github.com/kaftee/activy-checker/blob/main/CHANGELOG.md"
Issues = "https://github.com/kaftee/activy-checker/issues"

[project.scripts]
activy-checker = "activy_checker.cli:main"

[tool.setuptools]
packages = ["activy_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
