name: Question
description: Ask how to use activy-checker or why it behaves the way it does.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste passwords, tokens, email addresses or other personal data.
        The [usage guide](https://github.com/kaftee/activy-checker/blob/main/docs/usage.md) and
        [troubleshooting](https://github.com/kaftee/activy-checker/blob/main/docs/troubleshooting.md)
        may already have the answer.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you are trying to do
      description: Your setup and what you have tried so far, if it helps to answer.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `activy-checker --version`
      placeholder: activy-checker 0.2.7
    validations:
      required: false
